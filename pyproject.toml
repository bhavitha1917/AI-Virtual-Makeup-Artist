[project]
name = "beauty-studio"
version = "1.0.0"
description = "AI Virtual Makeup Artist — vision-based cosmetic recommendation and personalized makeup expert system"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
